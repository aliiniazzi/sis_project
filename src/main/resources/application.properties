# Application
spring.application.name=sis
spring.application.version=0.0.1-SNAPSHOT

# Server
server.servlet.context-path=/sis
server.port=8080

# Profile
spring.profiles.default=dev

# Spring MVC
spring.mvc.problemdetails.enabled=true
spring.web.resources.add-mappings=false

# Banner
spring.main.banner-mode=console

# SIS Configuration
sis.application-name=${spring.application.name}
sis.application-version=${spring.application.version}
sis.environment=${spring.profiles.active:default}


# Logging
logging.level.root=INFO
logging.level.org.aliniazi.sis=DEBUG
logging.file.name=logs/sis.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB


# Database
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=

# HikariCP connection pool
spring.datasource.hikari.pool-name=SIS-HikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000


# JPA / Hibernate

#spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.use_sql_comments=true

spring.jpa.properties.hibernate.jdbc.batch_size=50

spring.jpa.properties.hibernate.order_inserts=true

spring.jpa.properties.hibernate.order_updates=true

spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

spring.jpa.open-in-view=false